<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Single Profile PDF</title>
    <style>
        body {margin: 20px;}
        .timestamp {font-size: 0.9rem;text-align: right;}
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center mb-4">Profile Report : {{ profile.name }}</h1>
        <p class="timestamp">Generated on {{ timestamp }}</p>
        <div class="card">
            <p class="mb-2"><strong>Name:</strong> {{ profile.name }}</p>
            <p class="mb-2"><strong>Email:</strong> {{ profile.email }}</p>
            <p class="mb-2"><strong>Gender:</strong> {{ profile.gender }}</p>
            <p class="mb-2"><strong>Age:</strong> {{ profile.age }}</p>
            <p class="mb-2"><strong>Address:</strong> {{ profile.address }}</p>

        </div>
    </div>
</body>

</html>
